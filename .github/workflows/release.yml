name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.15"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip==26.3
        python -m pip install -r requirements-build.txt -r requirements-dev.txt

    - name: Validate Release Tag and Commit
      shell: python
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_COMMIT: ${{ github.sha }}
      run: |
        import os
        import subprocess
        import sys

        # GitHub runs `shell: python` bodies from a temporary file, so the
        # workspace is the working directory but is not on the import path.
        sys.path.insert(0, os.getcwd())
        from src.version import __version__

        actual_tag = os.environ["RELEASE_TAG"]
        expected_tag = f"v{__version__}"
        if actual_tag != expected_tag:
            raise SystemExit(
                f"Release tag {actual_tag!r} does not match app version {expected_tag!r}."
            )

        tagged_commit = os.environ["RELEASE_COMMIT"]
        ancestry = subprocess.run(
            [
                "git",
                "merge-base",
                "--is-ancestor",
                tagged_commit,
                "refs/remotes/origin/main",
            ],
            check=False,
        )
        if ancestry.returncode != 0:
            raise SystemExit(
                "Release tags must point to a commit reachable from protected main."
            )

    - name: Run Release Checks
      run: |
        python -m ruff check src tests scripts packaging
        python -m pytest -q

    - name: Build Executable
      run: |
        python -m PyInstaller --clean --noconfirm --onefile --windowed --name "EVETranslator_${{ github.ref_name }}" --icon="src\assets\icon.ico" --version-file="packaging\windows_version_info.txt" --additional-hooks-dir="packaging\hooks" --add-data "src\assets\icon.png;src\assets" --add-data "data;data" --collect-data "langdetect" --hidden-import "PySide6" --exclude-module "PySide6.QtNetwork" --exclude-module "setuptools" --exclude-module "packaging" --exclude-module "wheel" --exclude-module "typing_extensions" src/main.py

    - name: Package Windows Release
      run: |
        python scripts/package_windows_release.py --executable "dist\EVETranslator_${{ github.ref_name }}.exe" --version "${{ github.ref_name }}"

    - name: Extract Release Notes
      shell: python
      run: |
        import os
        import re

        tag = os.environ.get("GITHUB_REF_NAME", "")
        version = tag.lstrip("v")
        changelog_file = "CHANGELOG.md"
        output_file = "RELEASE_NOTES.md"

        if os.path.exists(changelog_file):
            with open(changelog_file, "r", encoding="utf-8") as source:
                content = source.read()

            pattern = re.compile(
                rf"## \[{re.escape(version)}\].*?\n(.*?)(?=\n## \[|$)",
                re.DOTALL,
            )
            match = pattern.search(content)
            notes = match.group(1).strip() if match else f"Release {tag}"
        else:
            notes = f"Release {tag}"

        with open(output_file, "w", encoding="utf-8", newline="\n") as target:
            target.write(f"{notes}\n")

    - name: Upload Release Build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-build
        path: |
          dist/EVETranslator_${{ github.ref_name }}.exe
          dist/EVETranslator_${{ github.ref_name }}_windows_x64.zip
          dist/EVETranslator_${{ github.ref_name }}_windows_x64/BUNDLED_COMPONENTS.json
          RELEASE_NOTES.md
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  scan:
    name: Scan Release with VirusTotal
    needs: build
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    environment:
      name: virustotal-release
    outputs:
      has_detections: ${{ steps.virustotal.outputs.has_detections }}

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.15"
        cache: 'pip'
        cache-dependency-path: requirements-release-scan.txt

    - name: Install VirusTotal Scan Dependencies
      run: |
        python -m pip install --upgrade pip==26.3
        python -m pip install -r requirements-release-scan.txt

    - name: Download Release Build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-build
        path: release-build

    - name: Scan Executable with VirusTotal
      id: virustotal
      timeout-minutes: 20
      env:
        VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      run: >
        python scripts/scan_virustotal.py
        --file "release-build\dist\EVETranslator_${{ github.ref_name }}.exe"
        --manifest "release-build\dist\EVETranslator_${{ github.ref_name }}_windows_x64\BUNDLED_COMPONENTS.json"
        --append-notes "release-build\RELEASE_NOTES.md"
        --github-output "$env:GITHUB_OUTPUT"
        --github-summary "$env:GITHUB_STEP_SUMMARY"

    - name: Upload VirusTotal Release Notes
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: virustotal-release-notes
        path: release-build/RELEASE_NOTES.md
        if-no-files-found: error
        retention-days: 1

  publish:
    name: Publish Release
    needs: scan
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
    - name: Download Release Build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-build
        path: release-build

    - name: Download VirusTotal Release Notes
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: virustotal-release-notes
        path: release-notes

    - name: Create Release
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
      with:
        files: |
          release-build/dist/EVETranslator_${{ github.ref_name }}_windows_x64.zip
        body_path: release-notes/RELEASE_NOTES.md
        draft: ${{ needs.scan.outputs.has_detections != 'false' }}
