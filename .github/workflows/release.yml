
name: Release

on:
  push:
    tags:
      - 'v*'


permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip==26.1.2
        python -m pip install -r requirements-build.txt -r requirements-dev.txt

    - name: Validate Tag Matches App Version
      shell: python
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        import os
        from src.version import __version__

        actual_tag = os.environ["RELEASE_TAG"]
        expected_tag = f"v{__version__}"
        if actual_tag != expected_tag:
            raise SystemExit(
                f"Release tag {actual_tag!r} does not match app version {expected_tag!r}."
            )

    - name: Run Release Checks
      run: |
        python -m ruff check src tests scripts packaging
        python -m pytest -q
    
    - name: Build Executable
      run: |
        python -m PyInstaller --clean --noconfirm --onefile --windowed --name "EVETranslator_${{ github.ref_name }}" --icon="src\assets\icon.ico" --version-file="packaging\windows_version_info.txt" --additional-hooks-dir="packaging\hooks" --add-data "src\assets\icon.png;src\assets" --add-data "data;data" --collect-data "langdetect" --hidden-import "PySide6" --exclude-module "PySide6.QtNetwork" --exclude-module "setuptools" --exclude-module "packaging" --exclude-module "wheel" --exclude-module "typing_extensions" src/main.py

    - name: Package Windows Release
      run: |
        python scripts/package_windows_release.py --executable "dist\EVETranslator_${{ github.ref_name }}.exe" --version "${{ github.ref_name }}"

    - name: Extract Release Notes
      id: extract_notes
      shell: python
      run: |
        import re
        import os
        
        tag = os.environ.get("GITHUB_REF_NAME", "")
        version = tag.lstrip("v")
        
        changelog_file = "CHANGELOG.md"
        output_file = "RELEASE_NOTES.md"
        
        if os.path.exists(changelog_file):
            with open(changelog_file, "r", encoding="utf-8") as f:
                content = f.read()
            
            # Regex to find the section for this version
            # Matches "## [0.1.0] - DATE" until the next "## [" or End of File
            pattern = re.compile(rf"## \[{re.escape(version)}\].*?\n(.*?)(?=\n## \[|$)", re.DOTALL)
            match = pattern.search(content)
            
            notes = ""
            if match:
                notes = match.group(1).strip()
            else:
                notes = f"Release {tag}"
                
            with open(output_file, "w", encoding="utf-8") as f:
                f.write(notes)
        else:
             with open(output_file, "w", encoding="utf-8") as f:
                f.write(f"Release {tag}")

    - name: Create Release
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/EVETranslator_${{ github.ref_name }}_windows_x64.zip

        body_path: RELEASE_NOTES.md
